<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault CRM — CRM Multi-Projeto</title>
    <meta name="description" content="Vault CRM: CRM inteligente para gestão de projetos educacionais e nutra" />
    <meta name="author" content="Vault CRM" />

    <!-- Favicon & App Icons -->
    <link rel="icon" href="/logo.png" type="image/png" />
    <!-- Apple Touch Icons - múltiplos tamanhos para diferentes dispositivos iOS -->
    <link rel="apple-touch-icon" sizes="57x57" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Aplica o design salvo antes da primeira pintura (evita flash). Mantenha em sincronia com src/lib/designs.ts -->
    <script>
      (function () {
        var designs = { vault: ["#0A0A0A", true], lima: ["#040505", true], claro: ["#F4F5F2", false] };
        var id = "vault";
        try { var s = localStorage.getItem("vault-design"); if (s && designs[s]) id = s; } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-design", id);
        if (designs[id][1]) root.classList.add("dark");
        root.style.colorScheme = designs[id][1] ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", designs[id][0]);
      })();
    </script>

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vault CRM" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="Vault CRM — CRM Multi-Projeto" />
    <meta property="og:description" content="Vault CRM: CRM inteligente para gestão de projetos educacionais e nutra" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
