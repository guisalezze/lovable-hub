name: Deploy Supabase Edge Functions

on:
  # Permite rodar manualmente pela aba Actions do GitHub
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Versão fixa: a "latest" mudou de comportamento (v3 passou a pedir
          # confirmação) e quebrou o deploy sem aviso.
          version: 3.1.0

      - name: Deploy all Edge Functions
        # --yes: no CI não há terminal para confirmar, sem ele a CLI v3 aborta.
        # Sem --no-verify-jwt: cada função segue o verify_jwt do supabase/config.toml.
        # Webhooks e funções públicas estão lá com verify_jwt = false; as demais
        # passam a exigir login (JWT) no gateway.
        run: |
          supabase functions deploy --remote=${{ secrets.SUPABASE_PROJECT_REF }} --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
